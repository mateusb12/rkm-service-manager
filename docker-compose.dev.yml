services:
  postgres-tunnel:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "/usr/local/bin/rkm-ssh-tunnel"]
    ports:
      - "127.0.0.1:15434:15432"
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent
      RKM_PG_PRIVATE_IP: 172.16.1.5
      RKM_PG_PRIVATE_PORT: 5432
    volumes:
      - type: bind
        source: ${HOME}/.ssh
        target: /host-ssh
        read_only: true
      - type: bind
        source: ${SSH_AUTH_SOCK}
        target: /run/ssh-agent
      - type: bind
        source: ./docker/ssh-tunnel/entrypoint.sh
        target: /usr/local/bin/rkm-ssh-tunnel
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 15432"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  backend:
    depends_on:
      postgres-tunnel:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the Hostinger PostgreSQL instance}
      DEV_METRICS_DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the Hostinger PostgreSQL instance}
      DB_PATH: ""
    volumes: !reset []
    command:
      - /bin/sh
      - -c
      - >-
        export DATABASE_URL=$$(printf '%s' "$$DATABASE_URL" | sed -E
        's#(://[^@]+@)[^:/]+(:[0-9]+)?/#\1postgres-tunnel:15432/#');
        export DEV_METRICS_DATABASE_URL=$$(printf '%s' "$$DEV_METRICS_DATABASE_URL" | sed -E
        's#(://[^@]+@)[^:/]+(:[0-9]+)?/#\1postgres-tunnel:15432/#');
        exec uv run --no-sync flask --app app:app run --host=0.0.0.0 --port=8787

  frontend:
    volumes:
      - ${HOME}/.wakatime.cfg:/root/.wakatime.cfg:ro
      - ${HOME}/.secrets.env:/root/.secrets.env:ro
