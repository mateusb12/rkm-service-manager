services:
  postgres-tunnel:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "/usr/local/bin/rkm-ssh-tunnel"]
    ports:
      - "127.0.0.1:15432:15432"
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent
      RKM_PG_PRIVATE_IP: ${RKM_PG_PRIVATE_IP:-127.0.0.1}
      RKM_PG_PRIVATE_PORT: ${RKM_PG_PRIVATE_PORT:-15432}
    volumes:
      - type: bind
        source: ${HOME}/.ssh
        target: /host-ssh
        read_only: true
      - type: bind
        source: ${SSH_AUTH_SOCK}
        target: /run/ssh-agent
      - type: bind
        source: ./docker/ssh-tunnel/entrypoint.sh
        target: /usr/local/bin/rkm-ssh-tunnel
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 15432"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  backend:
    depends_on:
      postgres-tunnel:
        condition: service_healthy

  frontend:
    volumes:
      - ${HOME}/.wakatime.cfg:/root/.wakatime.cfg:ro
