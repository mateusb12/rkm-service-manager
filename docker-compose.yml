services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8787:8787"
    environment:
      APP_ENV: development
      PORT: 8787
      DB_PATH: /data/rkm.db
      ACCESS_TTL: 15m
      SESSION_TTL: 8h
      SESSION_ABSOLUTE_TTL: 168h
      COOKIE_SECURE: "false"
    volumes:
      - rkm_data:/data

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      BACKEND_URL: http://backend:8787
      WAKATIME_API_KEY: ${WAKATIME_API_KEY:-}
      WAKATIME_PROJECT: ${WAKATIME_PROJECT:-rkm-service-manager}
      WAKATIME_START_DATE: ${WAKATIME_START_DATE:-2026-09-01}
      WAKATIME_TIMEZONE: ${WAKATIME_TIMEZONE:-America/Fortaleza}
    volumes:
      - ./frontend:/app
      - ./.git:/app/.git:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  rkm_data:
