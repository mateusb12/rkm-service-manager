services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_COMMIT_SHA: ${VITE_COMMIT_SHA:-unknown}
    ports:
      - "127.0.0.1:${RKM_HOST_PORT:-8787}:8787"
    expose:
      - "8787"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8787"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_PATH: /data/rkm.db
      DEV_METRICS_DB_PATH: /dev-data/rkm-dev.db
      DEV_METRICS_DATABASE_URL: ${DEV_METRICS_DATABASE_URL:-}
      ACCESS_TTL: 15m
      SESSION_TTL: 8h
      SESSION_ABSOLUTE_TTL: 168h
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      WAKATIME_ACCESS_TOKEN: ${WAKATIME_ACCESS_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - rkm_data:/data
      - rkm_dev_data:/dev-data
    restart: unless-stopped

  frontend:
    profiles:
      - dev
    build: ./frontend
    ports:
      - "127.0.0.1:${RKM_FRONTEND_PORT:-4173}:4173"
    environment:
      BACKEND_URL: http://backend:8787
    volumes:
      - ./frontend:/app
      - ./.git:/app/.git:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  rkm_data:
  rkm_dev_data:
