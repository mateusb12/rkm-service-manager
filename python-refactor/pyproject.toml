[project]
name = "rkm-service-manager-python"
version = "0.1.0"
description = "Python backend under incremental migration from the Go service"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=6,<7",
    "argon2-cffi>=25,<26",
    "PyJWT>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "SQLAlchemy>=2,<3",
    "flask-swagger-ui>=4,<5",
    "flask-smorest>=0.47,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-subtests>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

